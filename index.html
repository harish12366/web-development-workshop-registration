<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Workshop</title>

    <link rel="stylesheet" href="./style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- WORKSHOP HEADING -->
    <div class="workshop-heading">

        <h2>Web Development Workshop</h2>

        <p>Number Of Available Seats: 23</p>

    </div>


    <!-- IMAGE + FORM -->
    <div class="parentcontainer">

        <!-- LEFT SIDE -->
        <div class="image-section">

            <div class="imagecontainer">
                <img src="./techie potrait.png"
                    alt="Person learning web development">
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="form-section">

            <form>

                <!-- Username -->
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text"
                        placeholder="Username">
                </div>


                <!-- Email -->
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"
                        placeholder="Email">
                </div>


                <!-- Phone -->
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel"
                        placeholder="Phone No">
                </div>


                <!-- Number of Seats -->
                <div class="input-box">
                    <i class="fa-solid fa-users"></i>
                    <input type="number"
                        placeholder="Choose No of Seats">
                </div>


                <!-- Second Username -->
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text"
                        placeholder="Second Username">
                </div>


                <!-- Buttons -->
                <div class="button-container">

                    <button type="submit">
                        Submit
                    </button>

                    <button type="reset">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
